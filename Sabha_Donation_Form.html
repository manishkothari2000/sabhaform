<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --saffron:#AE5425;--saffron-lt:#E97132;--cream:#FAF6F0;
  --warm-white:#FFFDF9;--border:#DDD0C0;--text-dark:#2C1A0E;
  --text-mid:#6B4C35;--shadow:rgba(174,84,37,0.15);--green:#196B24;
}
body{min-height:100vh;background:var(--cream);font-family:Georgia,serif;color:var(--text-dark);
  display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;
  background-image:radial-gradient(ellipse 80% 30% at 50% 0%,rgba(233,113,50,0.07) 0%,transparent 70%);}
.logo{font-family:Georgia,serif;font-size:1.5rem;font-weight:bold;color:var(--saffron);
  text-align:center;margin-bottom:4px;letter-spacing:0.03em;}
.subtitle{text-align:center;font-size:0.85rem;color:var(--text-mid);font-style:italic;margin-bottom:20px;}
.card{background:var(--warm-white);border:1px solid var(--border);border-radius:14px;
  padding:24px 20px;width:100%;max-width:480px;box-shadow:0 4px 24px var(--shadow);}
.field{margin-bottom:18px;}
label{display:block;font-size:0.72rem;font-weight:bold;letter-spacing:0.08em;color:var(--saffron);
  text-transform:uppercase;margin-bottom:6px;}
select,input[type=text]{width:100%;padding:11px 14px;font-family:Georgia,serif;font-size:1rem;
  border:1.5px solid var(--border);border-radius:8px;background:#FFFCF8;color:var(--text-dark);
  outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
select:focus,input[type=text]:focus{border-color:var(--saffron-lt);box-shadow:0 0 0 3px rgba(233,113,50,0.1);}
.event-info{margin-top:8px;padding:10px 14px;background:#FFF5EE;border-radius:8px;
  border:1px solid #F0D0B8;font-size:0.88rem;color:var(--text-mid);display:none;}
.event-info.show{display:block;}
.event-info strong{color:var(--saffron);}
.name-toggle{display:flex;gap:8px;margin-bottom:10px;}
.toggle-btn{flex:1;padding:8px;font-family:Georgia,serif;font-size:0.85rem;
  border:1.5px solid var(--border);border-radius:8px;background:#FFFCF8;
  color:var(--text-mid);cursor:pointer;transition:all 0.2s;text-align:center;}
.toggle-btn.active{background:var(--saffron);color:white;border-color:var(--saffron);}
.couple-fields{display:none;gap:10px;}
.couple-fields.show{display:flex;}
.couple-fields input{flex:1;}
.amp{display:flex;align-items:center;font-size:1.1rem;color:var(--saffron);font-weight:bold;
  padding:0 4px;margin-top:0;}
.btn-submit{width:100%;padding:15px;font-family:Georgia,serif;font-size:1rem;font-weight:bold;
  letter-spacing:0.08em;text-transform:uppercase;color:white;
  background:linear-gradient(135deg,var(--saffron) 0%,var(--saffron-lt) 100%);
  border:none;border-radius:10px;cursor:pointer;margin-top:8px;
  box-shadow:0 4px 14px rgba(174,84,37,0.3);transition:transform 0.15s;}
.btn-submit:active{transform:scale(0.98);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
.success-msg{display:none;margin-top:16px;padding:14px 16px;background:#EDF7EE;
  border:1.5px solid #8BC98E;border-radius:10px;text-align:center;}
.success-msg.show{display:block;animation:fadeIn 0.3s ease;}
.success-msg .tick{font-size:1.8rem;}
.success-msg p{font-size:0.95rem;color:var(--green);margin-top:4px;}
.success-msg strong{color:#0D5210;}
.error-msg{display:none;margin-top:12px;padding:12px;background:#FFF0ED;
  border:1px solid #F4A88A;border-radius:8px;color:#C0442A;font-size:0.88rem;}
.error-msg.show{display:block;}
.vol-row{display:flex;gap:10px;align-items:flex-end;}
.vol-row .field{flex:1;margin-bottom:0;}
.divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:20px 0;}
.nav-link{text-align:center;margin-top:20px;font-size:0.88rem;color:var(--text-mid);}
.nav-link a{color:var(--saffron);text-decoration:none;font-weight:bold;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

<div class="card">
  <!-- Event Selection -->
  <div class="field">
    <label>Select Event</label>

      <div class="toggle-btn" id="btnCouple" onclick="setNameMode('couple')">Couple</div>
    </div>
    <!-- Single name -->
    <input type="text" id="singleName" placeholder="e.g. Dhimankumar Gohel" />
    <!-- Couple names -->
    <div class="couple-fields" id="coupleFields">
      <input type="text" id="coupleName1" placeholder="e.g. Umesh Desai" />
      <div class="amp">&amp;</div>
      <input type="text" id="coupleName2" placeholder="e.g. Mitalben Desai" />
    </div>
  </div>

  <div class="divider"></div>

  <!-- Volunteer -->
  <div class="field">
    <label>Your Name (Volunteer)</label>
    <input type="text" id="volunteerName" placeholder="e.g. Raj" />
  </div>

  <button class="btn-submit" id="btnSubmit" onclick="submitEntry()">Submit Donation</button>
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg">
    <div class="tick">✅</div>
    <p>Saved! <strong id="savedName"></strong> registered for <strong id="savedEvent"></strong></p>
  </div>
</div>

let nameMode = 'single';

// Filter to today and future events
function getUpcomingEvents() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayStr = today.toISOString().split('T')[0];
  return EVENTS_CALENDAR.filter(e => e.date >= todayStr);
}

function populateEvents() {
  const sel = document.getElementById('eventSelect');
  const events = getUpcomingEvents();
  const today = new Date().toISOString().split('T')[0];
  
  events.forEach(e => {
    const opt = document.createElement('option');
    opt.value = JSON.stringify(e);
    const isToday = e.date === today ? ' 📍 TODAY' : '';
    opt.textContent = e.display + ' — ' + e.description + ' ($' + e.amount + ')' + isToday;
    if(e.date === today) opt.style.fontWeight = 'bold';
    sel.appendChild(opt);
  });
  
  // Auto-select today's event if exists
  const todayEvents = events.filter(e => e.date === today);
  if(todayEvents.length === 1) {
    sel.value = JSON.stringify(todayEvents[0]);
    onEventChange();
  }
}

function onEventChange() {
  const val = document.getElementById('eventSelect').value;
  const info = document.getElementById('eventInfo');
  if(val) {
    const e = JSON.parse(val);
    document.getElementById('eventAmount').textContent = '$' + e.amount;
    document.getElementById('eventDay').textContent = e.day;
    info.classList.add('show');
  } else {
    info.classList.remove('show');
  }
}

function setNameMode(mode) {
  nameMode = mode;
  document.getElementById('btnSingle').classList.toggle('active', mode==='single');
  document.getElementById('btnCouple').classList.toggle('active', mode==='couple');
  document.getElementById('singleName').style.display = mode==='single' ? 'block' : 'none';
  document.getElementById('coupleFields').classList.toggle('show', mode==='couple');
}

function getSponsorName() {
  if(nameMode === 'single') {
    return document.getElementById('singleName').value.trim();
  } else {
    const n1 = document.getElementById('coupleName1').value.trim();
    const n2 = document.getElementById('coupleName2').value.trim();
    if(!n1 || !n2) return '';
    // First name of person 1 + & + full name of person 2
    const firstName = n1.split(' ')[0];
    return firstName + ' & ' + n2;
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.classList.add('show');
}
function clearError() {
  document.getElementById('errorMsg').classList.remove('show');
}

async function submitEntry() {
  clearError();
  document.getElementById('successMsg').classList.remove('show');

  const eventVal = document.getElementById('eventSelect').value;
  const sponsorName = getSponsorName();
  const volunteer = document.getElementById('volunteerName').value.trim();

  if(!eventVal) { showError('Please select an event.'); return; }
  if(!sponsorName) { showError('Please enter the sponsor name.'); return; }
  if(!volunteer) { showError('Please enter your volunteer name.'); return; }

  const event = JSON.parse(eventVal);
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const payload = {
      date: event.display,
      event: event.description,
      amount: event.amount,
      sponsorName: sponsorName,
      volunteer: volunteer
    };

    const result = await jsonpPost(SCRIPT_URL, payload);

    if(result.status === 'success') {
      document.getElementById('savedName').textContent = sponsorName;
      document.getElementById('savedEvent').textContent = event.description;
      document.getElementById('successMsg').classList.add('show');
      // Reset name fields
      document.getElementById('singleName').value = '';
      document.getElementById('coupleName1').value = '';
      document.getElementById('coupleName2').value = '';
    } else {
      showError('Error saving: ' + (result.message || 'Unknown error'));
    }
  } catch(err) {
    showError('Network error. Please check your connection and try again.');
  }

  btn.disabled = false; btn.textContent = 'Submit Donation';
}

populateEvents();


// JSONP fetch — bypasses CORS for Google Apps Script GET
function jsonpFetch(url) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error('Request timed out'));
    }, 10000);
    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName + '&t=' + Date.now();
    script.onerror = () => { clearTimeout(timeout); reject(new Error('Script load failed')); };
    document.body.appendChild(script);
  });
}

// POST via hidden iframe form — bypasses CORS for Google Apps Script POST
function iframePost(url, data) {
  return new Promise((resolve) => {
    const iframeName = 'iframe_' + Math.random().toString(36).slice(2);
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframeName;
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(data);
    form.appendChild(input);
    document.body.appendChild(form);

    iframe.onload = () => {
      setTimeout(() => {
        document.body.removeChild(iframe);
        document.body.removeChild(form);
        resolve({status: 'success'});
      }, 500);
    };
    form.submit();
    // Resolve after 3s regardless
    setTimeout(() => resolve({status: 'success'}), 3000);
  });
}
