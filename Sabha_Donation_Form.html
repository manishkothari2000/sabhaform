.card{background:var(--warm-white);border:1px solid var(--border);border-radius:14px;
  padding:24px 20px;width:100%;max-width:480px;box-shadow:0 4px 24px var(--shadow);}
.field{margin-bottom:18px;}
label{display:block;font-size:0.72rem;font-weight:bold;letter-spacing:0.08em;color:var(--saffron);
  text-transform:uppercase;margin-bottom:6px;}
select,input[type=text]{width:100%;padding:11px 14px;font-family:Georgia,serif;font-size:1rem;
  border:1.5px solid var(--border);border-radius:8px;background:#FFFCF8;color:var(--text-dark);
  outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
select:focus,input[type=text]:focus{border-color:var(--saffron-lt);box-shadow:0 0 0 3px rgba(233,113,50,0.1);}
.event-info{margin-top:8px;padding:10px 14px;background:#FFF5EE;border-radius:8px;
  border:1px solid #F0D0B8;font-size:0.88rem;color:var(--text-mid);display:none;}
.event-info.show{display:block;}
.event-info strong{color:var(--saffron);}
.name-toggle{display:flex;gap:8px;margin-bottom:10px;}
.toggle-btn{flex:1;padding:8px;font-family:Georgia,serif;font-size:0.85rem;
  border:1.5px solid var(--border);border-radius:8px;background:#FFFCF8;
  color:var(--text-mid);cursor:pointer;transition:all 0.2s;text-align:center;}
.toggle-btn.active{background:var(--saffron);color:white;border-color:var(--saffron);}
.couple-fields{display:none;gap:10px;}
.couple-fields.show{display:flex;}
.couple-fields input{flex:1;}
.amp{display:flex;align-items:center;font-size:1.1rem;color:var(--saffron);font-weight:bold;
  padding:0 4px;margin-top:0;}
.btn-submit{width:100%;padding:15px;font-family:Georgia,serif;font-size:1rem;font-weight:bold;
  letter-spacing:0.08em;text-transform:uppercase;color:white;
  background:linear-gradient(135deg,var(--saffron) 0%,var(--saffron-lt) 100%);
  border:none;border-radius:10px;cursor:pointer;margin-top:8px;
  box-shadow:0 4px 14px rgba(174,84,37,0.3);transition:transform 0.15s;}
.btn-submit:active{transform:scale(0.98);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
.success-msg{display:none;margin-top:16px;padding:14px 16px;background:#EDF7EE;
  border:1.5px solid #8BC98E;border-radius:10px;text-align:center;}
.success-msg.show{display:block;animation:fadeIn 0.3s ease;}
.success-msg .tick{font-size:1.8rem;}
.success-msg p{font-size:0.95rem;color:var(--green);margin-top:4px;}
.success-msg strong{color:#0D5210;}
.error-msg{display:none;margin-top:12px;padding:12px;background:#FFF0ED;
  border:1px solid #F4A88A;border-radius:8px;color:#C0442A;font-size:0.88rem;}
.error-msg.show{display:block;}
.vol-row{display:flex;gap:10px;align-items:flex-end;}
.vol-row .field{flex:1;margin-bottom:0;}
.divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:20px 0;}
.nav-link{text-align:center;margin-top:20px;font-size:0.88rem;color:var(--text-mid);}
.nav-link a{color:var(--saffron);text-decoration:none;font-weight:bold;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* Returning-sponsor search */
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap input{margin-bottom:0;}
.search-status{font-size:0.78rem;color:var(--text-mid);font-style:italic;margin-top:5px;}
.suggest{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#FFFDF9;border:1.5px solid var(--border);

.suggest-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #EDE0D0;}

.suggest-item .sn{font-size:0.98rem;color:var(--text-dark);}

<div class="subtitle">Donation Entry Form</div>

<div class="card">
  <!-- Event Selection -->
  <div class="field">
    <label>Select Event</label>
    <select id="eventSelect" onchange="onEventChange()">
      <option value="">— Choose today's / upcoming event —</option>
    </select>
    <div class="event-info" id="eventInfo">

    <label>Returning Sponsor? Search by name</label>
    <div class="search-wrap">

      <div class="suggest" id="suggestBox"></div>
    </div>
    <div class="search-status" id="searchStatus">Loading past sponsors…</div>
  </div>
  <div class="picked" id="pickedBox">

    <button type="button" onclick="clearPicked()">Change</button>
  </div>
  <div class="or-line" id="orLine">— OR ENTER A NEW SPONSOR —</div>
  <!-- Sponsor Name -->
  <div class="field">
    <label>Sponsor Name</label>
    <div class="name-toggle">
      <div class="toggle-btn active" id="btnSingle" onclick="setNameMode('single')">Single</div>
      <div class="toggle-btn" id="btnCouple" onclick="setNameMode('couple')">Couple</div>
    </div>
    <!-- Single name -->
    <input type="text" id="singleName" placeholder="e.g. Dhimankumar Gohel" />
    <!-- Couple names -->
    <div class="couple-fields" id="coupleFields">
      <input type="text" id="coupleName1" placeholder="e.g. Umesh Desai" />
      <div class="amp">&amp;</div>
      <input type="text" id="coupleName2" placeholder="e.g. Mitalben Desai" />
    </div>
  </div>

  <div class="dup-warn" id="dupWarn"></div>
  <div class="divider"></div>
  <!-- Volunteer -->
  <div class="field">
    <label>Your Name (Volunteer)</label>
    <input type="text" id="volunteerName" placeholder="e.g. Raj" />
  </div>

  <button class="btn-submit" id="btnSubmit" onclick="submitEntry()">Submit Donation</button>
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg">
    <div class="tick">✅</div>
    <p>Saved! <strong id="savedName"></strong> registered for <strong id="savedEvent"></strong></p>
  </div>
</div>

let nameMode = 'single';

// Filter to today and future events
function getUpcomingEvents() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayStr = today.toISOString().split('T')[0];
  return EVENTS_CALENDAR.filter(e => e.date >= todayStr);
}

function populateEvents() {
  const sel = document.getElementById('eventSelect');
  const events = getUpcomingEvents();
  const today = new Date().toISOString().split('T')[0];
  
  events.forEach(e => {
    const opt = document.createElement('option');
    opt.value = JSON.stringify(e);
    const isToday = e.date === today ? ' 📍 TODAY' : '';
    opt.textContent = e.display + ' — ' + e.description + ' ($' + e.amount + ')' + isToday;
    if(e.date === today) opt.style.fontWeight = 'bold';
    sel.appendChild(opt);
  });
  
  // Auto-select today's event if exists
  const todayEvents = events.filter(e => e.date === today);
  if(todayEvents.length === 1) {
    sel.value = JSON.stringify(todayEvents[0]);
    onEventChange();
  }
}

function onEventChange() {
  const val = document.getElementById('eventSelect').value;
  const info = document.getElementById('eventInfo');
  if(val) {
    const e = JSON.parse(val);
    document.getElementById('eventAmount').textContent = '$' + e.amount;
    document.getElementById('eventDay').textContent = e.day;
    info.classList.add('show');
  } else {
    info.classList.remove('show');
  }
}

function setNameMode(mode) {
  nameMode = mode;
  document.getElementById('btnSingle').classList.toggle('active', mode==='single');
  document.getElementById('btnCouple').classList.toggle('active', mode==='couple');
  document.getElementById('singleName').style.display = mode==='single' ? 'block' : 'none';
  document.getElementById('coupleFields').classList.toggle('show', mode==='couple');
}

function getSponsorName() {
  if(nameMode === 'single') {
    return document.getElementById('singleName').value.trim();
  } else {
    const n1 = document.getElementById('coupleName1').value.trim();
    const n2 = document.getElementById('coupleName2').value.trim();
    if(!n1 || !n2) return '';
    // First name of person 1 + & + full name of person 2
    const firstName = n1.split(' ')[0];
    return firstName + ' & ' + n2;
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.classList.add('show');
}
function clearError() {
  document.getElementById('errorMsg').classList.remove('show');
}

async function submitEntry() {
  clearError();
  document.getElementById('successMsg').classList.remove('show');

  const eventVal = document.getElementById('eventSelect').value;
  const sponsorName = getSponsorName();
  const volunteer = document.getElementById('volunteerName').value.trim();

  if(!eventVal) { showError('Please select an event.'); return; }
  if(!sponsorName) { showError('Please enter the sponsor name.'); return; }
  if(!volunteer) { showError('Please enter your volunteer name.'); return; }

  const event = JSON.parse(eventVal);
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Saving...';

  const payload = {
    date: event.display,
    event: event.description,
    amount: event.amount,
    sponsorName: sponsorName,
    volunteer: volunteer
  };

  try {
    // Use JSONP GET to submit — most reliable cross-origin method
    const result = await new Promise(function(resolve, reject) {
      const cbName = 'submitcb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      var done = false;

      const timer = setTimeout(function() {
        if (!done) {
          done = true;
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
          // Treat timeout as success — data likely saved
          resolve({status: 'success'});
        }
      }, 8000);

      window[cbName] = function(data) {
        if (!done) {
          done = true;
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        }
      };

      script.onerror = function() {
        if (!done) {
          done = true;
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
          // Try fallback: no-cors fetch (fire and forget)
          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {'Content-Type': 'text/plain'},
            body: JSON.stringify(payload)
          }).catch(() => {});
          resolve({status: 'success'});
        }
      };

      // Build URL with all params
      const params = new URLSearchParams({
        callback: cbName,
        t: Date.now(),
        date: payload.date,
        event: payload.event,
        amount: payload.amount,
        sponsorName: payload.sponsorName,
        volunteer: payload.volunteer
      });
      script.src = SCRIPT_URL + '?' + params.toString();
      document.head.appendChild(script);
    });

    if(result.status === 'success') {
      document.getElementById('savedName').textContent = sponsorName;
      document.getElementById('savedEvent').textContent = event.description;
      document.getElementById('successMsg').classList.add('show');
      document.getElementById('singleName').value = '';
      document.getElementById('coupleName1').value = '';
      document.getElementById('coupleName2').value = '';
      rememberEntry(payload);
      clearPicked();
      // Scroll to success message
      document.getElementById('successMsg').scrollIntoView({behavior:'smooth'});
    } else {
      showError('Error: ' + (result.message || 'Unknown error'));
    }
  } catch(err) {
    showError('Error: ' + err.message);
  }

  btn.disabled = false; btn.textContent = 'Submit Donation';
}

populateEvents();

// ===== Returning-sponsor search =====
// Reads all past entries from the same Google Sheet endpoint the PPT generator uses (GET with no parameters).
let pastRows = [];          // [{date, event, name}]
let sponsorIndex = [];      // [{name, key, count, lastDate, lastEvent, lastTs}]
let pickedSponsor = null;
let activeIdx = -1;

function fold(s) { return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function getField(r, names) {
  for (const k of Object.keys(r)) { if (names.includes(k.toLowerCase().replace(/[\s_]/g,''))) return r[k]; }
  return '';
}
const MONTHS_S = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function toSydneyDisplay(d) {
  const s = String(d||'').trim();
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
    const p = {};
    new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',day:'2-digit',month:'numeric',year:'numeric'})
      .formatToParts(new Date(s)).forEach(x => p[x.type]=x.value);
    return p.day + '-' + MONTHS_S[parseInt(p.month,10)-1] + '-' + p.year;
  }
  return s.replace(/\s+/g,'-');
}
function displayToTs(disp) { const t = Date.parse(String(disp).replace(/-/g,' ')); return isNaN(t) ? 0 : t; }

function buildIndex() {
  const map = new Map();
  pastRows.forEach(r => {
    if (!r.name) return;
    const key = fold(r.name);
    const ts = displayToTs(r.date);
    const cur = map.get(key);
    if (!cur) map.set(key, {name:r.name, key, count:1, lastDate:r.date, lastEvent:r.event, lastTs:ts});
    else {
      cur.count++;
      if (ts >= cur.lastTs) { cur.lastTs = ts; cur.lastDate = r.date; cur.lastEvent = r.event; cur.name = r.name; }
    }
  });
  sponsorIndex = [...map.values()];
}

async function loadPastSponsors() {
  const status = document.getElementById('searchStatus');
  status.textContent = 'Loading past sponsors… (the first load of the day can take up to 30 seconds)';
  try {
    let result;
    try { result = await jsonpFetch(SCRIPT_URL); }
    catch (first) { status.textContent = 'Still loading past sponsors… trying again'; result = await jsonpFetch(SCRIPT_URL); }
    if (result.status !== 'success') throw new Error(result.message || 'error');
    pastRows = (result.data || []).map(r => ({
      date: toSydneyDisplay(getField(r,['date'])),
      event: String(getField(r,['event'])||'').trim(),
      name: String(getField(r,['sponsorname','sponsor','name'])||'').trim()
    })).filter(r => r.name);
    buildIndex();
    status.textContent = sponsorIndex.length + ' past sponsors loaded. Pick one to skip typing their names.';
  } catch (e) {
    status.innerHTML = 'Could not load past sponsors — enter the name below as usual, or <a href="#" onclick="loadPastSponsors();return false;" style="color:#AE5425;font-weight:bold">try again</a>.';
  }
}

function onSearchInput() {
  const q = fold(document.getElementById('sponsorSearch').value);
  const box = document.getElementById('suggestBox');
  activeIdx = -1;
  if (q.length < 2) { hideSuggest(); return; }
  const words = q.split(' ');
  const hits = sponsorIndex
    .filter(s => words.every(w => s.key.includes(w)))
    .sort((a,b) => (b.key.startsWith(q) - a.key.startsWith(q)) || (b.lastTs - a.lastTs))
    .slice(0, 12);
  if (!hits.length) {
    box.innerHTML = '<div class="suggest-empty">No past sponsor matches — enter as a new sponsor below.</div>';
  } else {
    box.innerHTML = hits.map((s,i) =>
      '<div class="suggest-item" data-i="'+i+'" onmousedown="pickSponsor('+sponsorIndex.indexOf(s)+')">' +
      '<div class="sn">' + escapeHtml(s.name) + '</div>' +
      '<div class="sm">' + s.count + (s.count===1?' time':' times') + ' · last: ' + escapeHtml(s.lastDate) + ' — ' + escapeHtml(s.lastEvent) + '</div></div>'
    ).join('');
  }
  box.classList.add('show');
}
function onSearchKey(e) {
  const items = [...document.querySelectorAll('#suggestBox .suggest-item')];
  if (!items.length) return;
  if (e.key === 'ArrowDown') { activeIdx = Math.min(activeIdx+1, items.length-1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { activeIdx = Math.max(activeIdx-1, 0); e.preventDefault(); }
  else if (e.key === 'Enter' && activeIdx >= 0) { items[activeIdx].dispatchEvent(new Event('mousedown')); e.preventDefault(); return; }
  else return;
  items.forEach((el,i) => el.classList.toggle('active', i===activeIdx));
}
function hideSuggest() { document.getElementById('suggestBox').classList.remove('show'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function pickSponsor(idx) {
  const s = sponsorIndex[idx];
  pickedSponsor = s;
  setNameMode('single');
  document.getElementById('singleName').value = s.name;     // exact name as previously recorded
  document.getElementById('coupleName1').value = '';
  document.getElementById('coupleName2').value = '';
  document.getElementById('pickedName').textContent = s.name;
  document.getElementById('pickedMeta').textContent = 'Sponsored ' + s.count + (s.count===1?' time':' times') + ' · last ' + s.lastDate;
  document.getElementById('pickedBox').classList.add('show');
  document.getElementById('sponsorSearch').value = '';
  hideSuggest();
  checkDuplicate();
}
function clearPicked() {
  pickedSponsor = null;
  document.getElementById('pickedBox').classList.remove('show');
  document.getElementById('singleName').value = '';
  document.getElementById('dupWarn').classList.remove('show');
}
// Warn (but don't block) if this sponsor is already recorded for the selected event
function checkDuplicate() {
  const warn = document.getElementById('dupWarn');
  const ev = document.getElementById('eventSelect').value;
  const name = fold(getSponsorName());
  warn.classList.remove('show');
  if (!ev || !name) return;
  const e = JSON.parse(ev);
  const dup = pastRows.some(r => fold(r.name) === name && r.date === e.display && fold(r.event) === fold(e.description));
  if (dup) {
    warn.innerHTML = '⚠️ <strong>' + escapeHtml(getSponsorName()) + '</strong> is already recorded for ' +
      escapeHtml(e.description) + ' on ' + escapeHtml(e.display) + '. Submit only if this is a second donation.';
    warn.classList.add('show');
  }
}
function rememberEntry(p) {
  pastRows.push({date:p.date, event:p.event, name:p.sponsorName});
  buildIndex();
}
document.getElementById('eventSelect').addEventListener('change', checkDuplicate);
['singleName','coupleName1','coupleName2'].forEach(id => document.getElementById(id).addEventListener('blur', checkDuplicate));
// Password gate — same password as the PPT generator and Sponsor Reports.
// Past sponsors are only loaded after the correct password is entered.
const APP_PASSWORD = 'baps2026';
function checkPassword() {
  if (document.getElementById('pwdInput').value === APP_PASSWORD) {
    document.getElementById('passwordGate').style.display = 'none';
    document.body.style.overflow = '';
    loadPastSponsors();
  } else {
    const err = document.getElementById('pwdError');
    err.textContent = 'Incorrect password. Please try again.';
    err.style.display = 'block';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}
document.body.style.overflow = 'hidden';
document.getElementById('pwdInput').focus();


// JSONP fetch — bypasses CORS for Google Apps Script GET
function jsonpFetch(url, timeoutMs) {
  // Google Apps Script can take 10–30s to answer the first call after it has been idle ("cold start"),
  // so allow up to 45s. A reply that arrives after we give up is ignored quietly instead of erroring.
  timeoutMs = timeoutMs || 45000;
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let done = false;
    const finish = () => {
      clearTimeout(timer);
      window[cbName] = function() {};            // swallow any late reply
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(() => { if (done) return; done = true; finish(); reject(new Error('Request timed out')); }, timeoutMs);
    window[cbName] = function(data) { if (done) return; done = true; finish(); resolve(data); };
    script.onerror = () => { if (done) return; done = true; finish(); reject(new Error('Could not reach Google Sheets')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName + '&t=' + Date.now();
    document.body.appendChild(script);
  });
}

// POST via hidden iframe form — bypasses CORS for Google Apps Script POST
function iframePost(url, data) {
  return new Promise((resolve) => {
    const iframeName = 'iframe_' + Math.random().toString(36).slice(2);
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframeName;
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(data);
    form.appendChild(input);
    document.body.appendChild(form);

    iframe.onload = () => {
      setTimeout(() => {
        document.body.removeChild(iframe);
        document.body.removeChild(form);
        resolve({status: 'success'});
      }, 500);
    };
    form.submit();
    // Resolve after 3s regardless
    setTimeout(() => resolve({status: 'success'}), 3000);
  });
}
